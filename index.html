<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Explore - Hiace Calculator</title>
<style>
:root {
 --orange:#ff8847;
 --orange2:#ffb07a;
 --text:#111;
 --muted:#6b3a20;
}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{
 margin:0;padding:16px;min-height:100vh;
 background:linear-gradient(135deg,var(--orange),var(--orange2));
 color:var(--text)
}
.app{max-width:520px;margin:auto}
.card{
 background:rgba(255,255,255,.9);
 backdrop-filter:blur(18px);
 border-radius:24px;
 padding:20px;
 margin-bottom:14px;
 box-shadow:0 18px 50px rgba(70,30,5,.2);
 border:1px solid rgba(0,0,0,.1)
}
.brand{
 display:flex;align-items:center;gap:15px
}
.logo{
 width:75px;height:75px;object-fit:contain;border-radius:20px;
 background:#ff8847
}
h1{
 margin:0;
 font-size:28px;
 line-height:1.15;
 letter-spacing:-.03em;
 font-weight:900
}
.subtitle{
 margin-top:6px;color:var(--muted);
 font-size:14px
}
label{
 display:block;margin-top:14px;margin-bottom:7px;
 font-size:13px;font-weight:800
}
input{
 width:100%;height:54px;padding:14px;
 border-radius:16px;border:1px solid rgba(0,0,0,.15);
 font-size:16px;background:#fff
}
button{
 width:100%;height:56px;margin-top:16px;
 border:0;border-radius:17px;
 background:linear-gradient(135deg,#ff8847,#ef6f22);
 font-weight:900;font-size:16px;
 cursor:pointer
}
.result{display:none}
.total{
 padding:18px;border-radius:20px;
 background:linear-gradient(135deg,#ffd7c0,#fff)
}
.total span{font-weight:800;color:var(--muted);font-size:13px}
.total strong{
 display:block;font-size:42px;
 margin-top:8px;
 letter-spacing:-.04em
}
.row{
 display:flex;justify-content:space-between;
 padding:10px 0;border-bottom:1px dashed #ddd
}
.note{
 margin-top:15px;padding:12px;border-radius:15px;
 background:#fff0e8;font-size:13px;font-weight:700
}
</style>
</head>

<div>
<h1>Mood Explore</h1>
<div class="subtitle">Hiace Rental Calculator</div>

<div class="card">
<label>Lokasi Jemput</label>
<input id="jemput" placeholder="Masukkan lokasi jemput">

<label>Tujuan</label>
<input id="tujuan" placeholder="Masukkan tujuan">

<label>Jarak (KM)</label>
<input id="jarak" type="number" placeholder="Contoh: 450">

<label>Tol</label>
<input id="tol" type="number" placeholder="Masukkan biaya tol">

<label>Jumlah Hari</label>
<input id="hari" type="number" placeholder="Contoh: 2">

<button onclick="hitung()">HITUNG TARIF</button>
</div>

<div class="card result" id="hasil">
<div class="total">
<span>TOTAL ESTIMASI</span>
<strong id="total"></strong>
</div>
<div class="row"><span>Solar</span><b id="solar"></b></div>
<div class="row"><span>Tol PP</span><b id="tolpp"></b></div>
<div class="row"><span>Penyesuaian</span><b id="extra"></b></div>
<div class="note">Harga customer sudah termasuk Driver, BBM, dan Tol PP.</div>
<button onclick="copyWA()">COPY WHATSAPP</button>
</div>

</div>

<script>
let d={};
const rp=n=>"Rp"+n.toLocaleString("id-ID");
function hitung(){
let jarak=+document.getElementById("jarak").value;
let tol=+document.getElementById("tol").value;
let hari=+document.getElementById("hari").value;
let solar=(jarak*2/9)*6800;
let tolpp=tol*2;
let dasar=solar+tolpp+200000+(hari*800000);
let extra=dasar<3000000?250000:400000;
let final=Math.ceil((dasar+extra)/10000)*10000;
d={jemput:jemput.value,tujuan:tujuan.value,hari,final};
hasil.style.display="block";
total.innerText=rp(final);
document.getElementById("solar").innerText=rp(Math.round(solar));
document.getElementById("tolpp").innerText=rp(tolpp);
document.getElementById("extra").innerText=rp(extra);
}
function copyWA(){
let t=`Halo kak, berikut estimasi harga sewa Hiace:

📍 Jemput: ${d.jemput}
📍 Tujuan: ${d.tujuan}
📅 Durasi: ${d.hari} Hari

💰 Total: ${rp(d.final)}

Harga sudah termasuk:
✅ Driver
✅ BBM
✅ Tol PP

Terima kasih kak 🙏`;
navigator.clipboard.writeText(t);
alert("Berhasil disalin");
}
</script>
