<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiace Explore - Kalkulator Admin</title>
<style>
:root{
--bg:#ff8847;
--bg2:#ffb27d;
--card:#fff7f1;
--text:#111;
--muted:#6b3a20;
--primary:#ff8847;
--dark:#ef6f22;
--line:rgba(0,0,0,.12);
}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{
margin:0;
padding:14px;
min-height:100vh;
background:linear-gradient(135deg,var(--bg),var(--bg2));
color:var(--text)
}
.app{max-width:520px;margin:auto}
.card{
background:rgba(255,255,255,.9);
backdrop-filter:blur(18px);
border:1px solid var(--line);
border-radius:24px;
padding:20px;
margin-bottom:14px;
box-shadow:0 18px 50px rgba(70,30,5,.2)
}
.brand{
display:flex;
align-items:center;
gap:14px
}
.logo{
width:58px;height:58px;border-radius:18px;
background:linear-gradient(135deg,#111,#333);
display:flex;align-items:center;justify-content:center;
color:white;font-size:28px
}
h1{font-size:22px;margin:0}
.subtitle{color:var(--muted);font-size:13px;margin-top:5px}
label{
display:flex;
font-size:13px;
font-weight:800;
margin:14px 0 8px
}
input{
width:100%;
height:54px;
border-radius:16px;
border:1px solid #ddd;
padding:14px;
font-size:16px;
background:white
}
button{
width:100%;
height:56px;
border:0;
border-radius:17px;
background:linear-gradient(135deg,var(--primary),var(--dark));
font-weight:900;
font-size:16px;
margin-top:15px;
cursor:pointer
}
.result{display:none}
.total{
background:linear-gradient(135deg,#ffd3bb,#fff);
border-radius:20px;
padding:18px;
margin-bottom:15px
}
.total span{
font-size:13px;
font-weight:800;
color:var(--muted)
}
.total strong{
display:block;
font-size:38px;
margin-top:5px
}
.item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px dashed #ddd;
font-size:14px
}
.note{
margin-top:12px;
padding:12px;
border-radius:15px;
background:#fff0e8;
font-size:13px
}
</style>
</head>
<body>
<div class="app">

<div class="card">
<div class="brand">
<div class="logo">🚐</div>
<div>
<h1>Hiace Explore</h1>
<div class="subtitle">Kalkulator harga sewa Hiace</div>
</div>
</div>
</div>

<div class="card">
<label>Lokasi Jemput</label>
<input id="jemput" placeholder="Masukkan lokasi jemput">

<label>Tujuan</label>
<input id="tujuan" placeholder="Masukkan tujuan">

<label>Jarak (KM)</label>
<input id="jarak" type="number" placeholder="Contoh: 450">

<label>Tol</label>
<input id="tol" type="number" placeholder="Contoh: 300000">

<label>Jumlah Hari</label>
<input id="hari" type="number" placeholder="Contoh: 2">

<button onclick="hitung()">HITUNG TARIF</button>
</div>

<div class="card result" id="result">
<div class="total">
<span>TOTAL ESTIMASI</span>
<strong id="total"></strong>
</div>

<div class="item"><span>Solar</span><b id="solar"></b></div>
<div class="item"><span>Tol PP</span><b id="tolpp"></b></div>
<div class="item"><span>Driver</span><b>Rp200.000</b></div>
<div class="item"><span>Sewa Harian</span><b id="sewa"></b></div>
<div class="item"><span>Penyesuaian</span><b id="extra"></b></div>

<div class="note">Harga customer sudah termasuk Driver, BBM, dan Tol PP.</div>

<button onclick="copyWA()">COPY WHATSAPP</button>
</div>

</div>

<script>
let d={};
const rp=n=>"Rp"+n.toLocaleString("id-ID");

function hitung(){
let jarak=+document.getElementById("jarak").value;
let tol=+document.getElementById("tol").value;
let hari=+document.getElementById("hari").value;

let solar=(jarak*2/9)*6800;
let tolpp=tol*2;
let sewa=hari*800000;
let dasar=solar+tolpp+200000+sewa;
let extra=dasar<3000000?250000:400000;
let final=Math.ceil((dasar+extra)/10000)*10000;

d={
jemput:document.getElementById("jemput").value,
tujuan:document.getElementById("tujuan").value,
hari,final
};

result.style.display="block";
total.innerText=rp(final);
solar.innerText=rp(Math.round(solar));
tolpp.innerText=rp(tolpp);
document.getElementById("sewa").innerText=rp(sewa);
document.getElementById("extra").innerText=rp(extra);
}

function copyWA(){
let txt=`Halo kak, berikut estimasi harga sewa Hiace:

📍 Jemput: ${d.jemput}
📍 Tujuan: ${d.tujuan}
📅 Durasi: ${d.hari} Hari

💰 Total: ${rp(d.final)}

Harga sudah termasuk:
✅ Driver
✅ BBM
✅ Tol PP

Terima kasih kak 🙏`;
navigator.clipboard.writeText(txt);
alert("Berhasil disalin");
}
</script>
</body>
</html>
